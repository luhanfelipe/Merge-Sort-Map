<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <header>
        <h1>Merge Sort Map</h1>
        <p class="subtitulo">Visualizador interativo do algoritmo Merge Sort</p>
    </header>

    <main>
        <div class="controles">
            <button id="btn-reiniciar">🔄 Reiniciar</button>
        </div>

        <div class="mapa-container">
            <canvas id="mapa" width="900" height="600"></canvas>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
    <script>
        // Executa assim que a página carregar
        document.addEventListener('DOMContentLoaded', async () => {
            const cidades = await buscarCidades();
            desenharCidades(cidades);
        });

        // Evento para o botão Reiniciar/Gerar novas cidades ao clicar
        document.getElementById('btn-reiniciar')?.addEventListener('click', async () => {
            const cidades = await buscarCidades();
            desenharCidades(cidades);
        });
    </script>
</body>
</html>
