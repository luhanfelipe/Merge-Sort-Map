<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>
    <header>
        <a href="/" class="btn-voltar-mapa">⬅ Voltar</a>
        <div class="header-content">
            <h1>Merge Sort Map</h1>
            <p class="subtitulo">Visualizador interativo do algoritmo Merge Sort</p>
        </div>
    </header>

    <main>
        <div class="controles">
            <button id="btn-play" class="botao-acao btn-play">▶ Play</button>
            <button id="btn-pause" class="botao-acao btn-pause">⏸ Pause</button>
            <button id="btn-passo" class="botao-acao btn-passo">⏭ Passo a passo</button>
            <button id="btn-reiniciar" class="botao-acao btn-reiniciar">🔄 Reiniciar</button>

            <div class="velocidade-container">
                <label for="slider-velocidade">Velocidade:</label>
                <input type="range" id="slider-velocidade" min="1" max="10" value="5">
            </div>
        </div>

        <div class="mapa-container">
            <canvas id="mapa" width="900" height="600"></canvas>
        </div>
    </main>
    
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
    <script>
        document.getElementById('btn-play')?.addEventListener('click', play);
        document.getElementById('btn-pause')?.addEventListener('click', pause);
        document.getElementById('btn-passo')?.addEventListener('click', passoAPasso);
        document.getElementById('btn-reiniciar')?.addEventListener('click', reiniciar);
    </script>

</body>
</html>
